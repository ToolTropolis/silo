# Local development stack for Silo: SeaweedFS (durable backend), a 3-node rqlite
# cluster (tenant registry with Raft HA), and Vault in dev mode (KMS).
#
#   docker compose -f deploy/docker-compose.yaml up
#
# DEV-ONLY. Vault runs in dev mode with a fixed root token and the services are
# unauthenticated on localhost — never use this configuration in production.
services:
  seaweedfs:
    image: chrislusf/seaweedfs
    # The filer gRPC port (HTTP port + 10000 = 18888) is published so Silo's
    # credential issuer can write per-project S3 identities via the filer
    # ConfigurationApi.
    command: "server -s3 -s3.port=8333"
    ports:
      - "8333:8333"    # S3 API
      - "9333:9333"    # master UI
      - "8888:8888"    # filer HTTP
      - "18888:18888"  # filer gRPC (S3 identity config)

  # Each node publishes a distinct host port AND advertises a host-reachable
  # HTTP address (-http-adv-addr). Without the advertised address, rqlite
  # redirects clients to the leader's container-internal hostname, which the
  # host can't resolve — so a leader-follow client on the host would fail. All
  # three are published so a client can follow a failover to any node.
  rqlite1:
    image: rqlite/rqlite
    command: ["-node-id", "1", "-http-addr", "0.0.0.0:4001", "-http-adv-addr", "localhost:4001", "-raft-addr", "0.0.0.0:4002"]
    ports:
      - "4001:4001"

  rqlite2:
    image: rqlite/rqlite
    command: ["-node-id", "2", "-http-addr", "0.0.0.0:4001", "-http-adv-addr", "localhost:4003", "-raft-addr", "0.0.0.0:4002", "-join", "rqlite1:4002"]
    ports:
      - "4003:4001"
    depends_on:
      - rqlite1

  rqlite3:
    image: rqlite/rqlite
    command: ["-node-id", "3", "-http-addr", "0.0.0.0:4001", "-http-adv-addr", "localhost:4005", "-raft-addr", "0.0.0.0:4002", "-join", "rqlite1:4002"]
    ports:
      - "4005:4001"
    depends_on:
      - rqlite1

  vault:
    image: hashicorp/vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-token
    ports:
      # Host 8201 (not 8200) so Silo's Vault coexists with other local stacks
      # that already publish 8200. Container port stays 8200 internally.
      - "8201:8200"
