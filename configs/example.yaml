# Silo local-dev configuration.
#
# DEV-ONLY SCAFFOLDING. These values point at the services in
# deploy/docker-compose.yaml. Never commit real Vault tokens, SeaweedFS
# credentials, or production registry paths here — production config is supplied
# via environment variables or a secrets manager, not a checked-in file.

backend:
  endpoint: "http://localhost:8333"
  region: "us-east-1"       # SeaweedFS S3 gateway ignores region but the client lib expects one
  # Once any S3 identity exists, SeaweedFS disables anonymous access, so the
  # backend adapter authenticates as the silo-admin identity provisioned by
  # deploy/bootstrap-dev.sh. Dev-only throwaway values.
  access_key: "SILOADMIN"
  secret_key: "SILOADMINSECRET"

registry:
  driver: "rqlite"
  addresses:
    - "http://localhost:4001"
    - "http://localhost:4003"
    - "http://localhost:4005"
  # All three nodes are listed so the client can follow a leader failover to
  # any of them; gorqlite handles leader redirects automatically. Each node
  # advertises a host-reachable address (see deploy/docker-compose.yaml).

kms:
  driver: "vault"
  address: "http://localhost:8201"   # host port 8201 (see deploy/docker-compose.yaml)
  token: "dev-only-token"    # dev only — never a real credential in this file

cache:
  path: "./data/cache"        # bbolt files, one per project, live here locally
