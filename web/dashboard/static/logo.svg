<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Silo">
  <title>Silo</title>
  <!-- Vertical silo: domed cap + tall body. The body holds three stacked
       bands = versioned memory layers. Narrow footprint reads as "silo",
       not "container/box". -->
  <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- domed cap + body outline in one path -->
    <path d="M18 26 a14 14 0 0 1 28 0 V50 a4 4 0 0 1 -4 4 H22 a4 4 0 0 1 -4 -4 Z"/>
  </g>
  <!-- interior layers -->
  <g fill="currentColor">
    <rect x="26" y="30" width="12" height="3.5" rx="1.75"/>
    <rect x="26" y="37" width="12" height="3.5" rx="1.75" opacity="0.6"/>
    <rect x="26" y="44" width="8"  height="3.5" rx="1.75" opacity="0.35"/>
  </g>
</svg>
