{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silo — {{.Title}}</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a19; --muted: #6b6b68; --line: #e3e3e0;
    --accent: #7a5cff; --ok: #1a7f4b; --warn: #b45309; --card: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#e8e8e6; --muted:#9a9a96; --line:#2e2e2c;
            --accent:#a58cff; --ok:#4ade80; --warn:#fbbf24; --card:#1e1e1d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { border-bottom:1px solid var(--line); padding:0 24px; display:flex;
           align-items:center; gap:28px; background:var(--card); }
  .brand { font-weight:650; letter-spacing:-.01em; padding:16px 0; }
  .brand span { color:var(--muted); font-weight:400; }
  nav a { color:var(--muted); text-decoration:none; padding:18px 0;
          display:inline-block; border-bottom:2px solid transparent; }
  nav a:hover { color:var(--fg); }
  nav a.on { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:28px 24px; max-width:1180px; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-weight:600; color:var(--muted); font-size:12px;
       text-transform:uppercase; letter-spacing:.04em; padding:0 12px 8px 0;
       border-bottom:1px solid var(--line); }
  td { padding:11px 12px 11px 0; border-bottom:1px solid var(--line);
       vertical-align:top; }
  code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px;
          font-weight:600; border:1px solid var(--line); }
  .pill.active { color:var(--ok); border-color:var(--ok); }
  .pill.decommissioning { color:var(--warn); border-color:var(--warn); }
  .ref { color:var(--muted); }
  a { color:var(--accent); }
  .empty { color:var(--muted); padding:40px 0; text-align:center;
           border:1px dashed var(--line); border-radius:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:16px 18px; margin-bottom:14px; }
  .diff { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
  @media (max-width:820px){ .diff{ grid-template-columns:1fr; } }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px;
        padding:11px 13px; overflow-x:auto; margin:6px 0 0; font-size:12.5px; }
  .lbl { font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
         color:var(--muted); font-weight:600; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .note { background:var(--card); border:1px solid var(--line);
          border-left:3px solid var(--accent); border-radius:6px;
          padding:11px 14px; margin-bottom:18px; font-size:13.5px; }
  .chips a { display:inline-block; padding:5px 11px; margin:0 6px 6px 0;
             border:1px solid var(--line); border-radius:6px; text-decoration:none; }
  .chips a.on { border-color:var(--accent); }
  .meta { color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<header>
  <div class="brand">Silo <span>· dashboard</span></div>
  <nav>
    <a href="/" class="{{if eq .Active "registry"}}on{{end}}">Registry</a>
    <a href="/memory" class="{{if eq .Active "memory"}}on{{end}}">Memory</a>
    <a href="/distilations" class="{{if eq .Active "distilations"}}on{{end}}">Distilations</a>
  </nav>
</header>
<main>
{{template "body" .}}
</main>
</body>
</html>{{end}}
