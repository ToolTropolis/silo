name: Bug report
description: Report a defect in Silo (not a security issue — see below).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here. Report privately per
        [SECURITY.md](../../SECURITY.md), especially anything touching
        cross-tenant isolation.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include the component (silod / siloctl / silo-distil / dashboard / pkg/client).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Released version or commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, whether the docker-compose stack was running.
    validations:
      required: false
