name: cosign probe
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: version and flags
        run: |
          cosign version
          echo "=== sign-blob flags ==="
          cosign sign-blob --help 2>&1 | grep -iE "bundle|output-sig|output-cert" || true
          echo "=== verify-blob flags ==="
          cosign verify-blob --help 2>&1 | grep -iE "bundle|signature|certificate " || true
