name: Release

# Builds the three binaries for a tagged release and publishes them with a
# SHA-256 checksums manifest so consumers can verify what they downloaded
# (OSPS-BR-06.01 — released assets have a hashed manifest). Signing the manifest
# with a keyless signer (e.g. cosign/sigstore) is the follow-up to fully satisfy
# signed releases; wire it in before the first published tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  build-release:
    name: build binaries + checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build binaries
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for cmd in silod siloctl silo-distil; do
            for os in linux darwin; do
              for arch in amd64 arm64; do
                out="dist/${cmd}_${version}_${os}_${arch}"
                CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                  go build -trimpath -o "$out" "./cmd/${cmd}"
              done
            done
          done

      - name: Generate checksums manifest
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
